backend:
  name: github
  repo: SunshineMoonGit/log
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "static/images"
public_folder: "/images"

collections:
  # React & Next
  - name: "react-phase-1"
    label: "React - Phase 1 (JS & TS)"
    folder: "content/React & Next/Phase 1 - JavaScript & TypeScript"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "완료", name: "completed", widget: "boolean", default: false, required: false}

