<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title
      }}{{ end }}
    </title>
    <meta name="description" content="{{ .Site.Params.description }}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root[data-theme="light"] {
        --bg-canvas: #f6f7fb;
        --bg-primary: #ffffff;
        --bg-secondary: #f1f4f8;
        --bg-elevated: #ffffff;
        --bg-header: rgba(255, 255, 255, 0.92);
        --text-primary: #1f2933;
        --text-secondary: #5b6875;
        --text-muted: #8a94a3;
        --border: #d9e1ec;
        --border-strong: #c2ccda;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --accent-soft: rgba(37, 99, 235, 0.12);
        --shadow-soft: 0 16px 40px rgba(15, 23, 42, 0.08);
      }

      :root[data-theme="dark"] {
        --bg-canvas: #0f172a;
        --bg-primary: #111827;
        --bg-secondary: #1f2937;
        --bg-elevated: #1a2332;
        --bg-header: rgba(17, 24, 39, 0.86);
        --text-primary: #f8fafc;
        --text-secondary: #cbd5f5;
        --text-muted: #64748b;
        --border: #1f2a3a;
        --border-strong: #334155;
        --accent: #60a5fa;
        --accent-hover: #93c5fd;
        --accent-soft: rgba(147, 197, 253, 0.16);
        --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.55);
      }

      html {
        font-size: 16px;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      html[data-scroll-behavior="smooth"] {
        scroll-behavior: smooth;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg-canvas);
        color: var(--text-primary);
        line-height: 1.75;
        font-weight: 400;
        letter-spacing: -0.01em;
        transition: background 0.25s ease, color 0.25s ease;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      a {
        color: inherit;
        text-decoration: none;
        transition: color 0.2s ease, opacity 0.2s ease;
      }

      a:hover,
      a:focus-visible {
        color: var(--accent);
      }

      ::selection {
        background: var(--accent-soft);
        color: var(--accent-hover);
      }

      img {
        max-width: 100%;
        height: auto;
        border-radius: 14px;
      }

      .container {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 28px;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--bg-header);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        box-shadow: none;
        transition: background 0.25s ease, border 0.25s ease;
      }

      .site-header .header-content {
        min-height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .site-header .site-title {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.015em;
      }

      .site-header .header-actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .site-header .search-input {
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg-primary);
        min-width: 220px;
        font-size: 0.95rem;
        color: var(--text-primary);
        transition: border 0.2s ease, box-shadow 0.2s ease, min-width 0.25s ease;
      }

      .site-header .search-input::placeholder {
        color: var(--text-muted);
      }

      .site-header .search-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
        min-width: 260px;
      }

      .site-header .theme-toggle {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        background: var(--bg-primary);
        color: var(--text-primary);
        font-size: 0.95rem;
        padding: 8px 14px;
        border-radius: 999px;
        cursor: pointer;
        transition: border 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      .site-header .theme-toggle:hover {
        border-color: var(--accent);
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.12);
        transform: translateY(-1px);
      }

      main {
        flex: 1;
        padding: 24px 0 24px;
      }

      footer {
        border-top: 1px solid var(--border);
        background: var(--bg-primary);
        padding: 32px 0 48px;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.875rem;
      }

      footer a {
        color: var(--text-secondary);
      }

      @media (max-width: 768px) {
        .container {
          padding: 0 20px;
        }

        .site-header .header-content {
          flex-direction: column;
          align-items: stretch;
          gap: 14px;
          padding: 18px 0;
        }

        .site-header .header-actions {
          justify-content: space-between;
        }

        .site-header .search-input {
          flex: 1;
          min-width: 0;
        }

        .site-header .search-input:focus {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <div class="header-content">
          <a href="/log" class="site-title">{{ .Site.Title }}</a>
          <div class="header-actions">
            <input
              type="text"
              class="search-input"
              placeholder="검색..."
              id="search"
            />
            <button class="theme-toggle" id="theme-toggle">
              <span class="theme-icon">🌙</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main>
      {{ if or (eq .Kind "page") (eq .Kind "single") }} {{ block "main" . }}{{
      end }} {{ else }}
      <div class="container">{{ block "main" . }}{{ end }}</div>
      {{ end }}
    </main>

    <footer>
      <div class="container">
        <p>&copy; {{ now.Year }} {{ .Site.Title }} | Built with Hugo</p>
      </div>
    </footer>

    <script>
      // 다크모드 토글
      const themeToggle = document.getElementById("theme-toggle");
      const html = document.documentElement;
      const themeIcon = document.querySelector(".theme-icon");

      // 저장된 테마 불러오기
      const savedTheme = localStorage.getItem("theme") || "light";
      html.setAttribute("data-theme", savedTheme);
      themeIcon.textContent = savedTheme === "dark" ? "☀️" : "🌙";

      themeToggle.addEventListener("click", () => {
        const currentTheme = html.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";

        html.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
        themeIcon.textContent = newTheme === "dark" ? "☀️" : "🌙";
      });

      // 검색 기능
      const searchInput = document.getElementById("search");
      let searchIndex = null;
      let searchResults = null;

      // 검색 결과 컨테이너 생성
      const createSearchResults = () => {
        if (searchResults) return;
        searchResults = document.createElement("div");
        searchResults.className = "search-results";
        searchResults.style.cssText = `
          position: absolute;
          top: calc(100% + 8px);
          right: 0;
          width: 420px;
          max-width: 90vw;
          max-height: 500px;
          overflow-y: auto;
          background: var(--bg-primary);
          border: 1px solid var(--border);
          border-radius: 16px;
          box-shadow: var(--shadow-soft);
          padding: 12px;
          display: none;
          z-index: 200;
        `;
        searchInput.parentElement.style.position = "relative";
        searchInput.parentElement.appendChild(searchResults);
      };

      // 검색 인덱스 로드
      const loadSearchIndex = async () => {
        if (searchIndex) return;
        try {
          const response = await fetch("/log/index.json");
          searchIndex = await response.json();
        } catch (error) {
          console.error("Failed to load search index:", error);
        }
      };

      // 검색 수행
      const performSearch = (query) => {
        if (!query || query.length < 2) {
          searchResults.style.display = "none";
          return;
        }

        const results = searchIndex.filter((item) => {
          const searchText = `${item.title} ${item.summary} ${item.content}`.toLowerCase();
          return searchText.includes(query.toLowerCase());
        }).slice(0, 8);

        if (results.length === 0) {
          searchResults.innerHTML = '<div style="padding: 16px; color: var(--text-secondary); text-align: center;">검색 결과가 없습니다</div>';
          searchResults.style.display = "block";
          return;
        }

        searchResults.innerHTML = results.map((item) => `
          <a href="${item.permalink}" style="
            display: block;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 6px;
            transition: background 0.2s ease;
            color: var(--text-primary);
          " onmouseover="this.style.background='var(--bg-secondary)'" onmouseout="this.style.background='transparent'">
            <div style="font-weight: 600; font-size: 0.95rem; margin-bottom: 4px;">${item.title}</div>
            <div style="font-size: 0.85rem; color: var(--text-secondary); display: flex; gap: 8px; align-items: center;">
              <span>📅 ${item.date}</span>
              ${item.section ? `<span>📁 ${item.section}</span>` : ''}
            </div>
            ${item.summary ? `<div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">${item.summary}</div>` : ''}
          </a>
        `).join("");
        searchResults.style.display = "block";
      };

      // 검색 입력 이벤트
      searchInput.addEventListener("focus", () => {
        createSearchResults();
        loadSearchIndex();
      });

      searchInput.addEventListener("input", (e) => {
        if (!searchIndex) {
          loadSearchIndex().then(() => performSearch(e.target.value));
        } else {
          performSearch(e.target.value);
        }
      });

      // 외부 클릭시 검색 결과 닫기
      document.addEventListener("click", (e) => {
        if (searchResults && !searchInput.contains(e.target) && !searchResults.contains(e.target)) {
          searchResults.style.display = "none";
        }
      });

      const tocLinks = document.querySelectorAll(".article-toc a[href^='#']");

      tocLinks.forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          const href = link.getAttribute("href");
          if (!href || href === "#") return;

          const targetId = decodeURIComponent(href.slice(1));
          const targetElement =
            document.getElementById(targetId) || document.querySelector(href);
          if (!targetElement) return;

          // Remove the previous hash without affecting browser history
          const cleanUrl = window.location.href.split("#")[0];
          history.replaceState(null, "", cleanUrl);

          targetElement.scrollIntoView({ behavior: "smooth", block: "start" });

          // Update hash for deep-linking without pushing new history entry
          history.replaceState(null, "", href);
        });
      });
    </script>
  </body>
</html>
